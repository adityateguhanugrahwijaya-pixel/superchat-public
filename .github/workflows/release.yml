name: SuperChat Automatic Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Dual Release Archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Create Release Archives (Full & Update Package)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          FULL_ARCHIVE="superchat-${TAG_NAME}-full.zip"
          UPDATE_ARCHIVE="superchat-${TAG_NAME}-update.zip"

          echo "📦 Packaging Full Release: ${FULL_ARCHIVE}"
          zip -r "${FULL_ARCHIVE}" . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".next/*" \
            -x "local.db*" \
            -x ".env.local" \
            -x "appconfig.json"

          echo "⚡ Generating Update Package & delete.txt..."
          
          # Find previous tag for differential comparison
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n 1 || true)
          echo "Previous release tag detected: '${PREV_TAG}'"

          # Create delete.txt listing deleted files
          if [ -n "${PREV_TAG}" ]; then
            echo "# Files removed in ${TAG_NAME} since ${PREV_TAG}:" > delete.txt
            git diff --name-only --diff-filter=D "${PREV_TAG}" "${TAG_NAME}" >> delete.txt || true
          else
            echo "# No previous release tag found." > delete.txt
          fi

          mkdir -p update_package

          if [ -n "${PREV_TAG}" ]; then
            echo "Collecting modified and added files since ${PREV_TAG}..."
            git diff --name-only --diff-filter=AM "${PREV_TAG}" "${TAG_NAME}" | while read -r file; do
              if [ -f "$file" ]; then
                mkdir -p "update_package/$(dirname "$file")"
                cp "$file" "update_package/$file"
              fi
            done
          else
            echo "No previous tag found; generating source bundle in update package..."
            rsync -av --exclude="node_modules" --exclude=".git" --exclude=".next" --exclude="local.db*" --exclude=".env.local" --exclude="appconfig.json" ./ update_package/
          fi

          # Copy delete.txt into update package
          cp delete.txt update_package/delete.txt

          # Create update package zip
          cd update_package
          zip -r "../${UPDATE_ARCHIVE}" .
          cd ..
          rm -rf update_package

          echo "FULL_ARCHIVE=${FULL_ARCHIVE}" >> $GITHUB_ENV
          echo "UPDATE_ARCHIVE=${UPDATE_ARCHIVE}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FULL_ARCHIVE }}
            ${{ env.UPDATE_ARCHIVE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          name: SuperChat ${{ github.ref_name }}
          body: |
            ## ⚡ SuperChat Release ${{ github.ref_name }}

            ### 📦 Release Packages:
            1. **Full Release Package**: `${{ env.FULL_ARCHIVE }}` (Fresh 1-click installation with launchers)
            2. **Update Patch Package**: `${{ env.UPDATE_ARCHIVE }}` (Contains updated files & `delete.txt` for existing installations)

            ### 🚀 Quick Start:
            - **Linux / macOS**: `./start.sh`
            - **Windows**: Double-click `start.bat`

            ---
            *Automated dual release package generated by GitHub Actions.*
