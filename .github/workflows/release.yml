name: SuperChat Automatic Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Release Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --include=optional

      - name: Create Release Archive (ZIP)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="superchat-${TAG_NAME}.zip"
          echo "Packaging SuperChat release: ${ARCHIVE_NAME}"
          
          # Create zip package excluding git, node_modules, local db, and environment secrets
          zip -r "${ARCHIVE_NAME}" . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x ".next/*" \
            -x "local.db*" \
            -x ".env.local" \
            -x "appconfig.json"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          name: SuperChat ${{ github.ref_name }}
          body: |
            ## ⚡ SuperChat Release ${{ github.ref_name }}

            ### 📦 Fast 1-Click Installation:
            1. Download and extract `${{ env.ARCHIVE_NAME }}`.
            2. Run the 1-click launcher for your OS:
               - **Linux / macOS**: `./start.sh`
               - **Windows**: Double-click `start.bat`

            ---
            *Automated release generated by GitHub Actions.*
